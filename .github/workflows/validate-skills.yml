name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and conform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the skill dependency graph
        run: node scripts/validate-skill-graph.mjs

      - name: Verify derived frontmatter is regenerated and committed
        run: node scripts/derive-skill-graph.mjs

      - name: Reject newly introduced sensitive content
        env:
          REDACT_SENSITIVE_CONFIG_JSON: ${{ secrets.REDACT_SENSITIVE_CONFIG_JSON }}
          REDACT_SENSITIVE_CONFIG_REQUIRED: ${{ vars.REDACT_SENSITIVE_CONFIG_REQUIRED }}
        run: node scripts/scan-sensitive.mjs

      - name: Run validator and conformance tests
        run: >-
          node scripts/run-registered-tests.mjs
          scripts/doctrine-manifest.test.mjs
          scripts/run-registered-tests.test.mjs
          scripts/skill-intent.test.mjs
          scripts/scan-sensitive.test.mjs
          scripts/validate-skill-graph.test.mjs
          scripts/derive-skill-graph.test.mjs
          scripts/workflow-registration.test.mjs
          skills/_base/_atoms/artifact-classify/artifact-classify.test.mjs
          skills/_base/_atoms/chronicle-append/chronicle-append.test.mjs
          skills/_base/_atoms/chronicle-replay/chronicle-replay.test.mjs
          skills/_base/_atoms/doctrine-evaluate/doctrine-evaluate.test.mjs
          skills/_base/_atoms/doctrine-evaluate/doctrine-evaluate.adversarial.test.mjs
          skills/_base/_atoms/redact-sensitive/redact-sensitive.config.test.mjs
          skills/_base/_molecules/chronicler/chronicler.test.mjs
          skills/_base/_molecules/chronicler/chronicler.adversarial.test.mjs
          skills/_base/_molecules/roast-coordinate-review/roast-coordinate-review.adversarial.test.mjs
          skills/roast/roast.conformance.test.mjs
          skills/roast/_atoms/artifact-profile/artifact-profile.test.mjs
          skills/roast/_atoms/intent-screen/intent-screen.test.mjs
          skills/roast/_atoms/intent-screen/intent-screen.adversarial.test.mjs
          skills/roast/_atoms/intent-source/intent-source.test.mjs
          skills/roast/_atoms/intent-source/intent-source.drift.test.mjs
          skills/roast/_atoms/doctrine-select/doctrine-select.test.mjs
          skills/roast/_atoms/doctrine-select/doctrine-select.adversarial.test.mjs
          skills/roast/_atoms/roast-contract/roast-contract.test.mjs
          skills/roast/_atoms/roast-contract/roast-contract.drift.test.mjs
          skills/roast/_atoms/roast-trusted-lenses/roast-trusted-lenses.test.mjs
          skills/create-skill/create-skill.conformance.test.mjs
          skills/create-skill/_atoms/intent-elicitation/intent-elicitation.test.mjs
          skills/create-skill/_atoms/intent-elicitation/intent-elicitation.drift.test.mjs
          skills/create-skill/_atoms/intent-storage-gate/intent-storage-gate.test.mjs
          skills/create-skill/_atoms/intent-synthesis/intent-synthesis.test.mjs
          skills/create-skill/_atoms/intent-synthesis/intent-synthesis.drift.test.mjs
          skills/create-skill/_atoms/roast-round-ledger/roast-round-ledger.test.mjs
          skills/create-skill/_atoms/roast-round-ledger/roast-round-ledger.drift.test.mjs
          skills/create-skill/_atoms/rubber-duck-brief/rubber-duck-brief.test.mjs
          skills/skill-coach/skill-coach.conformance.test.mjs
          skills/prompt-coach/prompt-coach.conformance.test.mjs
          skills/optimize-prompt/optimize-prompt.conformance.test.mjs
          skills/optimize-prompt/_molecules/prompt-optimization/prompt-optimization.test.mjs
          skills/skill-coach/_atoms/coach-persona/coach-persona.drift.test.mjs
          skills/skill-coach/_atoms/definition-packet/definition-packet.test.mjs
          skills/skill-coach/_atoms/definition-packet/definition-packet.adversarial.test.mjs
          skills/run-ci/_atoms/ci-runner/ci-runner.test.mjs
          skills/domain-mapping/domain-mapping.conformance.test.mjs
          skills/interrogate/interrogate.conformance.test.mjs
          skills/discovery/discovery.conformance.test.mjs
          skills/proof-of-concept/proof-of-concept.conformance.test.mjs
          skills/next-step-selection/next-step-selection.conformance.test.mjs
          skills/model-role-resolution/model-role-resolution.conformance.test.mjs
          skills/model-role-resolution/_molecules/model-role-resolver/model-role-resolver.test.mjs
          skills/roast/_molecules/roast-intent/roast-intent.test.mjs
          skills/cmux-orchestrate/_atoms/cmux-detect/cmux-detect.test.mjs
          skills/cmux-orchestrate/_atoms/cmux-dispatch/cmux-dispatch.test.mjs
          skills/cmux-orchestrate/_atoms/cmux-helper-pane/cmux-helper-pane.test.mjs
          skills/cmux-orchestrate/_atoms/cmux-invoke/cmux-invoke.test.mjs
          skills/cmux-orchestrate/_atoms/cmux-signal/cmux-signal.test.mjs
          skills/_base/_molecules/persist-bounded-handoff/persist-bounded-handoff.test.mjs
          skills/_base/_molecules/persist-bounded-handoff/persist-bounded-handoff.adversarial.test.mjs
          skills/handoff/handoff.test.mjs
