name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and conform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the skill dependency graph
        run: node scripts/validate-skill-graph.mjs

      - name: Verify derived frontmatter is regenerated and committed
        run: node scripts/derive-skill-graph.mjs

      - name: Reject newly introduced sensitive content
        env:
          REDACT_SENSITIVE_CONFIG_JSON: ${{ secrets.REDACT_SENSITIVE_CONFIG_JSON }}
          REDACT_SENSITIVE_CONFIG_REQUIRED: ${{ vars.REDACT_SENSITIVE_CONFIG_REQUIRED }}
        run: node scripts/scan-sensitive.mjs

      - name: Run validator and conformance tests
        run: >-
          node scripts/run-registered-tests.mjs
          scripts/doctrine-manifest.test.mjs
          scripts/run-registered-tests.test.mjs
          scripts/skill-intent.test.mjs
          scripts/scan-sensitive.test.mjs
          scripts/validate-skill-graph.test.mjs
          scripts/derive-skill-graph.test.mjs
          scripts/workflow-registration.test.mjs
          skills/_base/_atoms/artifact-classify/artifact-classify.test.mjs
          skills/_base/_atoms/chronicle-append/chronicle-append.test.mjs
          skills/_base/_atoms/chronicle-replay/chronicle-replay.test.mjs
          skills/_base/_atoms/contradiction-check/contradiction-check.test.mjs
          skills/_base/_atoms/doctrine-evaluate/doctrine-evaluate.test.mjs
          skills/_base/_atoms/doctrine-evaluate/doctrine-evaluate.adversarial.test.mjs
          skills/_base/_atoms/redact-sensitive/redact-sensitive.config.test.mjs
          skills/_base/_atoms/prompt-intake/prompt-intake.test.mjs
          skills/_base/_atoms/provider-detect/provider-detect.test.mjs
          skills/shepherd/_atoms/provider-state/provider-state.test.mjs
          skills/ship/_atoms/provider-review/provider-review.test.mjs
          skills/_base/_molecules/chronicler/chronicler.test.mjs
          skills/_base/_molecules/chronicler/chronicler.adversarial.test.mjs
          skills/_base/_molecules/roast-coordinate-review/roast-coordinate-review.adversarial.test.mjs
          skills/roast/roast.conformance.test.mjs
