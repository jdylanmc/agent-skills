name: Validate library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctrine:
    name: Doctrine integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/doctrine-manifest.test.mjs .agents/skills/doctrine/tests/*.test.mjs .agents/skills/scout/tests/skill-file.test.mjs
      - run: node --test .agents/skills/joe-mode-cmux/tests/*.test.mjs
      - run: node --test .agents/skills/joe-mode-orca/tests/*.test.mjs
      - run: node --test .agents/skills/joe-mode-paseo/tests/*.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:pack
        env:
          DISABLE_TELEMETRY: '1'

  remote-install:
    name: Published GitHub install
    needs: doctrine
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:pack
        env:
          DISABLE_TELEMETRY: '1'
          SKILLS_PACK_SOURCE: https://github.com/${{ github.repository }}/tree/main
